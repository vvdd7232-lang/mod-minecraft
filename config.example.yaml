# ===========================================================================
#  Конфигурация моста «веб-чат ИИ <-> терминал».
#  Скопируйте в config.yaml и отредактируйте под себя.
# ===========================================================================

# Адрес CDP вашего браузера (порт, с которым запустили Chrome):
cdp_url: http://127.0.0.1:9222

# Какой чат использовать: auto (определить по URL вкладки) |
# chatgpt | claude | gemini | generic
site: auto

# Регулярка для выбора нужной вкладки, если открыто несколько (необязательно).
# Например: "chatgpt\\.com"
tab_url_regex: ""

shell:
  # auto | linux | windows | macos  — от этого зависят команды и промпт
  os: auto
  # Свой путь к шеллу (необязательно): /bin/bash, /bin/zsh, powershell.exe
  path: ""
  # Рабочая папка, в которой стартует терминал.
  cwd: "."
  # Таймаут одной команды, секунд (потом шлём Ctrl+C):
  command_timeout: 600
  # Убирать ANSI-цвета из вывода:
  strip_ansi: true

# Как часто опрашивать страницу на новые ответы ИИ, сек:
poll_interval: 1.2
# Ответ должен «постабилизироваться» (не меняться) два опроса подряд —
# так мы не реагируем на ещё печатающийся ответ.
stable_polls: 2
# Обрабатывать ответы, уже висевшие в чате на момент старта моста?
process_existing_on_start: false
# Спрашивать подтверждение перед КАЖДОЙ командой (y/n) в терминале:
require_confirmation: false

# Лимиты на размер вывода, отправляемого обратно в чат:
output:
  max_chars: 12000
  head_chars: 4000

browser:
  # Команда `termbridge launch` откроет браузер с этим портом и профилем:
  port: 9222
  profile_dir: "./.chrome-profile"
  # Путь к браузеру, если не нашёлся автоматически (необязательно):
  path: ""

# --- Настройки для site: generic (любой сайт/локальная страница) -----------
generic:
  # CSS-селектор пузыря ответа ассистента:
  assistant_selector: ".assistant"
  # CSS-селектор поля ввода (textarea или contenteditable):
  composer_selector: "#composer"
  # Как отправлять: "enter" (Enter) или "button:<css-селектор кнопки>":
  submit: "button:#send-btn"
