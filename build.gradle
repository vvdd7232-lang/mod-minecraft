plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Resolve the name during configuration; rename runs without access to Project
// when Gradle's configuration cache is enabled.
def bundledLicenseName = "LICENSE_${mod_id}".toString()
tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { bundledLicenseName }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Pure mechanical rules are tested without starting Minecraft.
repositories { mavenCentral() }
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test).configure { useJUnitPlatform() }

// Exact public Create 6.0.10 release, not a moving development Maven build.
repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}
dependencies {
    compileOnly 'maven.modrinth:create:UjX6dr61'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'

}

// Separate real server launches prove that the optional class-loading boundary works.
neoForge.runs {
    verifyStandalone {
        type = 'gameTestServer'
        gameDirectory = layout.buildDirectory.dir('gametest/standalone')
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'elementalstaves.testCreate', 'false'
        jvmArgument '-Xmx2G'
    }
    verifyCreate {
        type = 'gameTestServer'
        gameDirectory = layout.buildDirectory.dir('gametest/create')
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'elementalstaves.testCreate', 'true'
        jvmArgument '-Xmx2G'
    }
}
dependencies.add(neoForge.runs.verifyCreate.additionalRuntimeClasspathConfiguration.name, 'maven.modrinth:create:UjX6dr61')
if (providers.gradleProperty('withCreate').map { it.toBoolean() }.getOrElse(false)) {
    [neoForge.runs.client, neoForge.runs.server, neoForge.runs.gameTestServer].each { run ->
        dependencies.add(run.additionalRuntimeClasspathConfiguration.name, 'maven.modrinth:create:UjX6dr61')
    }
}
tasks.named('runVerifyCreate').configure { mustRunAfter 'runVerifyStandalone' }
tasks.named('check').configure { dependsOn 'runVerifyStandalone', 'runVerifyCreate' }
