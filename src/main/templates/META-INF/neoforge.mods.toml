modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/vvdd7232-lang/mod-minecraft"
logoFile="elementalstaves.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional, but a deliberately bounded API target when installed.
[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[6.0.10,6.0.11)"
ordering="AFTER"
side="BOTH"
